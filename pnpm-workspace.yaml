packages:
  - packages/*
  - examples

# pnpm v11's runDepsStatusCheck auto-runs `pnpm install` before every
# `pnpm <script>` if it sees node_modules drift, with args derived from
# the persisted workspace state. In this repo that path can fire as
# `pnpm install --production` and prune devDependencies (vitest, eslint,
# husky, prettier) — destroying the dev environment as a side effect of
# an unrelated `pnpm e2e:foo` / `pnpm typecheck` invocation.
#
# `warn` keeps the diagnostic (you'll see "your node_modules are out of
# sync with your lockfile" and know to run `pnpm install` explicitly)
# but pnpm never deletes anything implicitly. `pnpm install` invoked by
# hand still works the way you expect; only the pre-script auto-install
# is disarmed.
#
# Note: `confirmModulesPurge` and `CI=true` are NOT substitutes — they
# only suppress the "are you sure?" TTY prompt around the destructive
# install; the install itself still runs and still prunes. The
# `CI=true` use in packages/ci/src/deploy-prod/pack.ts is a different
# code path (`pnpm deploy --prod` rebuilds a fresh staging dir) and
# stays as-is.
verifyDepsBeforeRun: warn

allowBuilds:
  # embedded-postgres ships its Postgres binaries as per-platform optional
  # packages, each with a postinstall (`hydrate-symlinks.js`) that materialises
  # the binary symlinks the embedded PG runtime needs. pnpm 11 errors
  # ERR_PNPM_IGNORED_BUILDS on any UNDECIDED build script, so every platform
  # variant that can be installed on a test/build machine must be decided here —
  # not just the linux-x64 one the primary dev machine installs. The ARM
  # cache-cross-platform tester installs @embedded-postgres/linux-arm64; leaving
  # it undecided aborted its `pnpm install --frozen-lockfile`.
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  '@embedded-postgres/linux-arm': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/linux-ia32': true
  '@embedded-postgres/linux-ppc64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/windows-x64': true
  '@swc/core': true
  # cpu-features (ssh2's optional crypto-acceleration addon) is explicitly
  # DISALLOWED (`false`, not absent — pnpm 11 errors ERR_PNPM_IGNORED_BUILDS on
  # an undecided build script). It is a node-gyp native build that needs a
  # C/C++ toolchain, but our service images build on the compiler-free DHI
  # `node:*-debian13-dev` base (no cc/gcc/make/python). Its install script
  # throws fatally ("Unable to detect compiler type"), which aborts the whole
  # `pnpm install` on any layer-cache miss (orchestrator/agent/platform images).
  # cpu-features is OPTIONAL — ssh2 runs in pure-JS mode without it (ssh2's own
  # install.js already exits 0 when its binding can't build), so skipping it is
  # the correct, no-regression fix rather than bloating the build image with a
  # toolchain. Flipping this back to `true` reintroduces the fatal build.
  cpu-features: false
  esbuild: true
  protobufjs: true
  sharp: true
  # ssh2 is a TRANSITIVE dep (dockerode -> docker-modem -> ssh2); nothing in this
  # repo imports it directly, and every dockerode connection uses a unix/podman
  # socketPath, never the optional ssh:// transport that would exercise ssh2 at
  # runtime. ssh2's own install.js runs node-gyp to build an OPTIONAL crypto
  # binding; on our compiler-free, Python-free DHI node:*-debian13-dev base that
  # build always fails and floods every `pnpm install` (release/CI + service
  # images) with misleading `gyp ERR! ... no Python` lines before exiting 0 and
  # falling back to pure JS. Disabling the build (explicit `false`, not absent —
  # pnpm 11 errors ERR_PNPM_IGNORED_BUILDS on an undecided script) skips the
  # doomed node-gyp run entirely: no gyp noise, ssh2 still works in pure-JS mode.
  # Flipping this back to `true` reintroduces the noise. Same rationale as
  # cpu-features above.
  ssh2: false

# Transitive-dep version clamps. These live in pnpm-workspace.yaml (the
# canonical location in pnpm 11+) rather than in package.json's legacy
# `pnpm.overrides` field — pnpm 11 reads top-level workspace settings
# from this file and silently ignores `pnpm.overrides` in package.json
# when a workspace manifest exists. Sourced from the weekly CVE scan.
overrides:
  axios: '>=1.15.2'
  'brace-expansion@>=2.0.0 <3.0.0': '>=2.0.3'
  defu: '>=6.1.5'
  # GHSA-gv7w-rqvm-qjhr (esbuild Deno-path RCE, CVSS 8.1). We consume
  # esbuild only via Node (transitive build/bundling dep) so the Deno
  # surface is never reached, but two resolved versions were present
  # (0.25.12 via vite@6 from Playwright CT, 0.28.0 via vite@8) — this
  # clamp lifts both to the fixed 0.28.1 as a defence-in-depth bump.
  esbuild: '>=0.28.1'
  fast-xml-builder: '>=1.1.7'
  follow-redirects: '>=1.16.0'
  lodash: '>=4.18.0'
  # Pinned to the 8.x line. GHSA-66ff/685m/75px/2pr8/fx83/jvwf are fixed
  # in 7.5.6 (7.x line) and 8.0.2 (8.x line) separately — the clamp prevents
  # accidental regression to a pre-fix 8.x patch (e.g. 8.0.1). Every
  # remaining parent declares a 7.x range: dockerode itself (`^7.3.2`), its
  # @grpc/proto-loader 0.7.x (`^7.2.5`), and @grpc/proto-loader 0.8.x
  # (`^7.5.5`) under @grpc/grpc-js, which both dockerode and the OTel gRPC
  # exporters pull. @opentelemetry/otlp-transformer stopped depending on
  # protobufjs directly at 0.222.0, so OTel no longer pins it. Drop the
  # override when every one of those parents declares protobufjs ^8 —
  # `pnpm why protobufjs` lists them. Tracked by /version-audit +
  # /vulnerability-scan.
  protobufjs: '>=8.0.2'
  '@protobufjs/utf8': '>=1.1.1'
  # GHSA-mp2f-45pm-3cg9 (CVE-2026-53486, CRITICAL 9.1) — path-traversal /
  # link-following in @xhmikosr/decompress archive extraction (symlink +
  # hardlink escape of the output dir, sibling-prefix containment bug, and
  # setuid/setgid preservation when extracting as root). Resolved 11.1.2
  # transitively via the @xhmikosr/decompress-* extractors; the fix landed on
  # the 11.x line in 11.1.3 (also backported to 10.2.1) — clamp forward to it.
  '@xhmikosr/decompress': '>=11.1.3'
  # Upgrade sweep CVE clamps — transitive deps whose parents' ranges pin them
  # below the patched version, so a plain `pnpm update` cannot lift them:
  #   brace-expansion 5.x  GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895 (>=5.0.9)
  #   fast-uri 3.x         GHSA-4c8g-83qw-93j6 / GHSA-7p8r-x3mc-p8w7 / GHSA-v2hh-gcrm-f6hx (>=3.1.5, via ajv)
  #   ip-address 10.x      GHSA-mwp4-54f8-5fhr (>=10.3.1, via express-rate-limit)
  #   hono 4.x             GHSA-8j4g-w8fx-2239 + cohort (>=4.12.34, via @modelcontextprotocol/sdk)
  #   @hono/node-server 1.x GHSA-frvp-7c67-39w9 (>=1.19.15, via @modelcontextprotocol/sdk)
  # Scoped to the affected major so no cross-major is forced. Drop each clamp
  # once every parent's range reaches the patched line. Tracked by the
  # upgrade sweep (/vulnerability-scan).
  # The hono clamp is written as ^4.13.7 — above the CVE floor, and matching
  # every workspace manifest verbatim. pnpm applies overrides before resolving,
  # so an importer records the overridden specifier; its up-to-date check then
  # compares that against the raw manifest and warns "out of sync" whenever the
  # two differ. Keeping the clamp equal to the declared range avoids that.
  'brace-expansion@5': '>=5.0.9'
  'fast-uri@3': '>=3.1.5 <4.0.0'
  'ip-address@10': '>=10.3.1'
  'hono@4': '^4.13.7'
  '@hono/node-server@1': '>=1.19.15'
  # 2026-09-14 additions, same shape (parents' ranges admit the patched line,
  # but a resolved lock node is never re-resolved by `pnpm update <direct>`):
  #   fast-uri 3.x clamp bounded to `<4.0.0` — the unbounded `>=3.1.5` let ajv's `^3.0.1`
  #     resolve to 4.1.2, which carries GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc /
  #     GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp (all `>=4.0.0 <4.1.3`; 3.x is unaffected)
  #   qs 6.x                  GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (>=6.16.0, via body-parser)
  #   postcss-selector-parser 7.x  GHSA-w9m9-85wc-3x92 (>=7.1.3, via postcss-nested)
  #   hono 4.x clamp raised to ^4.13.7 — GHSA-gqvv-2mrq-wpjv / GHSA-g6gw-c38x-mqfc / GHSA-crvj-82cr-hjcx (>=4.13.5)
  'qs@6': '>=6.16.0'
  'postcss-selector-parser@7': '>=7.1.3'

minimumReleaseAge: 2880 # 48 hours

# The npm registry's slim metadata format (`application/vnd.npm.install-v1+json`,
# the one pnpm fetches by default) does not always populate the per-version
# `time` map — most visibly for scoped packages like `@opentelemetry/*`. When
# pnpm can't find a publish time for a candidate version, it would otherwise
# error with ERR_PNPM_MISSING_TIME. Setting this to `true` makes it warn and
# fall back to allowing the version, which matches the behaviour we'd get if
# the registry served a `null` time. The hard-block path (the version-specific
# carve-outs below) still applies to known CVE-remediation releases.
minimumReleaseAgeIgnoreMissingTime: true

minimumReleaseAgeExclude:
  - '@kici-dev/*'
  # Each carve-out below names exact versions only, so future releases still go
  # through the 48-hour soak.
  # GHSA-gv7w-rqvm-qjhr esbuild fix (published <7 days at pin time). The
  # platform-specific @esbuild/* binary shims publish in lockstep with the
  # main package (same version, same release moment), so they carry the
  # same carve-out.
  - 'esbuild@0.28.1'
  - '@esbuild/aix-ppc64@0.28.1'
  - '@esbuild/android-arm@0.28.1'
  - '@esbuild/android-arm64@0.28.1'
  - '@esbuild/android-x64@0.28.1'
  - '@esbuild/darwin-arm64@0.28.1'
  - '@esbuild/darwin-x64@0.28.1'
  - '@esbuild/freebsd-arm64@0.28.1'
  - '@esbuild/freebsd-x64@0.28.1'
  - '@esbuild/linux-arm@0.28.1'
  - '@esbuild/linux-arm64@0.28.1'
  - '@esbuild/linux-ia32@0.28.1'
  - '@esbuild/linux-loong64@0.28.1'
  - '@esbuild/linux-mips64el@0.28.1'
  - '@esbuild/linux-ppc64@0.28.1'
  - '@esbuild/linux-riscv64@0.28.1'
  - '@esbuild/linux-s390x@0.28.1'
  - '@esbuild/linux-x64@0.28.1'
  - '@esbuild/netbsd-arm64@0.28.1'
  - '@esbuild/netbsd-x64@0.28.1'
  - '@esbuild/openbsd-arm64@0.28.1'
  - '@esbuild/openbsd-x64@0.28.1'
  - '@esbuild/openharmony-arm64@0.28.1'
  - '@esbuild/sunos-x64@0.28.1'
  - '@esbuild/win32-arm64@0.28.1'
  - '@esbuild/win32-ia32@0.28.1'
  - '@esbuild/win32-x64@0.28.1'
  # Kysely 0.29.0 major bump (5 days old at time of pin) — paired with
  # kysely-ctl 0.21.0 which adds the 0.29 peer-dep range. Tracked as a
  # queued upgrade.
  - 'kysely@0.29.0'
  - 'kysely-ctl@0.21.0'
